affinity:
	nodeAffinity:
		requiredDuringSchedulingIgnoredDuringExecution:
			nodeSelectorTerms:
			- matchExpressions:
				- key: worker-type
					operator: In
					values:
					- virtual
				- key: cpu-type
					operator: In
					values:
					- e5-4650
		preferredDuringSchedulingIgnoredDuringExecution:
			- weight: 100
				preference:
					matchExpressions:
					- key: tier
						operator: NotIn
						values:
						- basic
