apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: global-customizations
  name: 99-customizations
spec:
  config:
    ignition:
      version: 3.1.0
    storage:
      files:
      - contents:
          source: data:text/plain;charset=utf-8;base64,
        mode: 0600
        overwrite: true
        path: /var/roothome/.bashrc
      - contents:
          source: data:text/plain;charset=utf-8;base64,W0pvdXJuYWxdClN0b3JhZ2U9cGVyc2lzdGVudAo=
        mode: 0600
        overwrite: true
        path: /etc/systemd/journald.conf
