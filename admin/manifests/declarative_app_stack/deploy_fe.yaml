apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: fe
    app.kubernetes.io/component: fe
    app.kubernetes.io/instance: fe
  name: fe
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      deployment: fe
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        deployment: fe
    spec:
      containers:
      - env:
        - name: API_SVC
          valueFrom:
            secretKeyRef:
              key: API_SVC
              name: fe-config
          image: quay.io/rdacosta/world_fe:latest
        imagePullPolicy: IfNotPresent
        name: fe
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /opt/app-root/src/config.js
          name: config-js
          subPath: config.js
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: http://${API_SVC}/city?name=Liverpool
            port: 8080
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: config.js
            path: config.js
          name: fe-config
        name: config-js
