spec:
  template:
    spec:
      containers:
        - name: bar
          volumeMounts:
            - mountPath: /etc/pki/ca-trust/extracted/pem
              name: trusted-ca
      volumes:
        - configMap:
            defaultMode: 420
            name: ca-bundle 
            items:
              - key: service-ca.crt 
                path: tls-ca-bundle.pem
          name: trusted-ca
