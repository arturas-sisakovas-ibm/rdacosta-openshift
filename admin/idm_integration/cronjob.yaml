apiVersion: batch/v1
kind: CronJob
metadata:
  name: group-sync
  namespace: idm-integrator
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: sync
            image: registry.ocp4.example.com:8443/openshift4/ose-cli:v4.10
            command:
            - /bin/sh
            - -c
            - oc adm groups sync --sync-config=/etc/config/cron-ldap-sync.yml --confirm
            volumeMounts:
              - mountPath: "/etc/config"
                name: "ldap-sync-volume"
              - mountPath: "/etc/secrets"
                name: "ldap-bind-password"
          volumes:
            - name: "ldap-sync-volume"
              configMap:
                name: idm-cm
            - name: "ldap-bind-password"
              secret:
                secretName: idm-secret
          serviceAccountName: idm-integrator
          serviceAccount: idm-integrator
