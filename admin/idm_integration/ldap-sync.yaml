kind: LDAPSyncConfig
apiVersion: v1
url: ldaps://penrith.zero-effort.net
bindDN: uid=integrator,cn=users,cn=accounts,dc=zero-effort,dc=net
bindPassword: 
insecure: false
ca: ca.crt
rfc2307:
    groupsQuery:
        baseDN: "cn=groups,cn=accounts,dc=zero-effort,dc=net"
        scope: sub
        derefAliases: never
        pageSize: 0
        filter: (objectClass=ipausergroup)
    groupUIDAttribute: dn
    groupNameAttributes: [ cn ]
    groupMembershipAttributes: [ member ]
    usersQuery:
        baseDN: "cn=users,cn=accounts,dc=zero-effort,dc=net"
        scope: sub
        derefAliases: never
        pageSize: 0
    userUIDAttribute: dn
    userNameAttributes: [ uid ]
