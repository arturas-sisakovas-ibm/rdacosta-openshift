apiVersion: v1
kind: Namespace 
metadata:
  name: idm-integration
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idm-integrator
  namespace: idm-integration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: idm-integrator-role
rules:
  - apiGroups:
      - ""
      - "user.openshift.io"
    resources:
      - "groups"
    verbs:
      - "get"
      - "list"
      - "create"
      - "update"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: idm-integrator-binding
subjects:
- kind: ServiceAccount
  name: idm-integrator
  namespace: idm-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idm-integrator-role
