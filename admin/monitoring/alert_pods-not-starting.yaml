apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pods-not-started
  namespace: openshift-monitoring
spec:
  groups:
  - name: pods-not-started.rules
    rules:
    - alert: PodsNotStarted
      expr: |
        min_over_time(sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed|Crash|Err"})[15m:1m]) > 0
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: "Pods in namespace {{ $labels.namespace }} are not starting"
        description: "One or more pods in namespace {{ $labels.namespace }} have been in a non-running state (Pending, Unknown, Failed, Crash, Err) for at least 15 minutes."
        receiver: Mail

