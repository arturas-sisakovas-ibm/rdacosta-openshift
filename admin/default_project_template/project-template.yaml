apiVersion: template.openshift.io/v1
kind: Template
metadata:
  creationTimestamp: null
  name: project-request
  namespace: openshift-config
objects:
- apiVersion: project.openshift.io/v1
  kind: Project
  metadata:
    annotations:
      openshift.io/description: ${PROJECT_DESCRIPTION}
      openshift.io/display-name: ${PROJECT_DISPLAYNAME}
      openshift.io/requester: ${PROJECT_REQUESTING_USER}
    creationTimestamp: null
    name: ${PROJECT_NAME}
  spec: {}
  status: {}
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    creationTimestamp: null
    name: admin
    namespace: ${PROJECT_NAME}
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: admin
  subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ${PROJECT_ADMIN_USER}
- apiVersion: v1
  kind: ResourceQuota
  metadata:
    name: ${PROJECT_NAME}-quota
  spec:
    hard:
      cpu: 1
      memory: 1Gi
      pods: 4
      requests.cpu: 500m
      requests.memory: 512Mi
      limits.cpu: 1
      limits.memory: 1Gi
      configmaps: 10
      persistentvolumeclaims: 4
      secrets: 10
      services: 5
      requests.storage: 10Gi
      nfs-storage.storage-class.kubernetes.io/requests.storage: 8Gi
      nfs-storage.storage-class.kubernetes.io/persistentvolumeclaims: '3'
      lvms-vg1.storage-class.kubernetes.io/requests.storage: 2Gi
      lvms-vg1.storage-class.kubernetes.io/persistentvolumeclaims: '3'
- apiVersion: v1
  kind: LimitRange
  metadata:
    name: ${PROJECT_NAME}-limits
  spec:
    limits:
      - type: Container
        max:
          cpu: 500m
          memory: 512Mi
        min:
          cpu: 30m
          memory: 64Mi
        default:
          cpu: 500m
          memory: 512Mi
        defaultRequest:
          cpu: 50m
          memory: 128Mi
        maxLimitRequestRatio:
          cpu: 10
          memory: 8
      - type: Pod
        max:
          cpu: 500m
          memory: 512Mi
        min:
          cpu: 30m
          memory: 64Mi
- kind: NetworkPolicy
  apiVersion: networking.k8s.io/v1
  metadata:
    name: ${PROJECT_NAME}-netpol
    namespace: ${PROJECT_NAME}
  spec:
    podSelector: {}
    ingress:
      - from:
          - podSelector: {}
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: openshift-ingress
    policyTypes:
      - Ingress
parameters:
- name: PROJECT_NAME
- name: PROJECT_DISPLAYNAME
- name: PROJECT_DESCRIPTION
- name: PROJECT_ADMIN_USER
- name: PROJECT_REQUESTING_USER

