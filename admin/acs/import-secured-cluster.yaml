---
apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: managed-cluster
  namespace: stackrox
spec:
  centralEndpoint: central-stackrox.apps.ocp4.example.com:443
  clusterName: managed-cluster
  clusterLabels:
    cluster: managed-cluster
    env: prod
    cluster-group: training
  sensor:
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 4Gi
        cpu: 2
  admissionControl:
    listenOnCreates: true
    listenOnUpdates: true
    listenOnEvents: true
    replicas: 1
    bypass: BreakGlassAnnotation
    contactImageScanners: ScanIfMissing
    timeoutSeconds: 5
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 500Mi
        cpu: 500m
  perNode:
    collector:
      collection: CORE_BPF
      resources:
        requests:
          memory: 200Mi
          cpu: 60m
        limits:
          memory: 1Gi
          cpu: 750m
    compliance:
      resources:
        requests:
          memory: 10Mi
          cpu: 10m
        limits:
          memory: 512Mi
          cpu: 1
    nodeInventory:
      resources:
        requests:
          memory: 10Mi
          cpu: 10m
        limits:
          memory: 512Mi
          cpu: 1
  scanner:
    analyzer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          memory: 512Mi
          cpu: 250m
        limits:
          memory: 2Gi
          cpu: 8
    db:
      resources:
        requests:
          memory: 256Mi
          cpu: 200m
        limits:
          memory: 2Gi
          cpu: 1
  scannerV4:
    scannerComponent: AutoSense
    indexer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          memory: 512Mi
          cpu: 250m
        limits:
          memory: 2Gi
          cpu: 1
    db:
      resources:
        requests:
          memory: 256Mi
          cpu: 200m
        limits:
          memory: 2Gi
          cpu: 1
      persistence:
        persistentVolumeClaim:
          claimName: scanner-v4-db
          storageClassName: nfs-storage
  auditLogs:
    collection: Auto
  monitoring:
    openshift:
      enabled: true
...
