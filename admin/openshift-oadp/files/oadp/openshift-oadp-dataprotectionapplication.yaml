---
apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: oadp-dpa
  namespace: openshift-adp
spec:
  configuration:
    nodeAgent:
      enable: true
      uploaderType: restic
      podConfig:
        # oc label node/master{01..03} node-role.kubernetes.io/worker-
        # oc label node/worker{01..02} node-role.kubernetes.io/worker=""
        # oc label node/worker{01..02} node-role.kubernetes.io/nodeAgent=""
        # oc get nodes -l node-role.kubernetes.io/nodeAgent
        nodeSelector:
          # node-role.kubernetes.io/infra: ""
          # node-role.kubernetes.io/worker: ""
          node-role.kubernetes.io/nodeAgent: ""
    velero:
      defaultPlugins:
        - openshift
        - aws
        - csi
        - kubevirt
      resourceTimeout: 10m
  snapshotLocations:
    - velero:
        config:
          profile: default
          region: us-east-1
        provider: aws
  backupLocations:
    - velero:
        config:
          profile: default
          region: us-east-1
          s3Url: 'https://s3-openshift-storage.apps.ocp4.example.com'
          s3ForcePathStyle: 'true'
          insecureSkipTLSVerify: 'true'
        credential:
          key: cloud
          name: cloud-credentials
        objectStorage:
          bucket: my-object-bucket-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
          prefix: velero
        default: true
        provider: aws
