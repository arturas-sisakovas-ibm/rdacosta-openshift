apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: deny-app1-to-app2
spec:
  priority: 5
  subject:
    namespaces:
      matchLabels:
        kubernetes.io/metadata.name: app2
  ingress:
    - name: deny-from-app1
      action: Deny
      from:
        - namespaces:
            matchLabels:
              kubernetes.io/metadata.name: app1
