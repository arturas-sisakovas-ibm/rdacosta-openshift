---
apiVersion: v1
kind: Namespace
metadata:
  name: vms
---
apiVersion: v1
kind: Service
metadata:
  name: headless
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: headless
    port: 5434
    protocol: TCP
    targetPort: 5434
  selector:
    network.kubevirt.io/headlessService: headless
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    app: vm1
    kubevirt.io/dynamic-credentials-support: "true"
  name: vm1
  namespace: vms
spec:
  dataVolumeTemplates:
  - apiVersion: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    metadata:
      creationTimestamp: null
      name: vm1
    spec:
      source:
        http:
          url: http://utility:8080/openshift4/images/rhel9.qcow2
      storage:
        resources:
          requests:
            storage: 10Gi
  runStrategy: Always
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: small
        vm.kubevirt.io/os: rhel9
        vm.kubevirt.io/workload: server
      creationTimestamp: null
      labels:
        kubevirt.io/domain: vm1
        kubevirt.io/size: small
        network.kubevirt.io/headlessService: headless
    spec:
      architecture: amd64
      domain:
        cpu:
          cores: 1
          sockets: 1
          threads: 1
        devices:
          disks:
          - disk:
              bus: virtio
            name: rootdisk
          - disk:
              bus: virtio
            name: cloudinitdisk
          interfaces:
          - masquerade: {}
            model: virtio
            name: default
          networkInterfaceMultiqueue: true
          rng: {}
        features:
          acpi: {}
          smm:
            enabled: true
        firmware:
          bootloader:
            efi: {}
        machine:
          type: pc-q35-rhel9.4.0
        memory:
          guest: 2Gi
        resources: {}
      hostname: vm1
      subdomain: headless
      livenessProbe:
        guestAgentPing:
          timeoutSeconds: 5
        initialDelaySeconds: 40
        periodSeconds: 5
        successThreshold: 1
        failureThreshold: 3
      networks:
      - name: default
        pod: {}
      terminationGracePeriodSeconds: 180
      volumes:
      - dataVolume:
          name: vm1
        name: rootdisk
      - cloudInitNoCloud:
          userData: |-
            #cloud-config
            user: cloud-user
            password: redhatocp
            chpasswd: { expire: False }
            ssh_authorized_keys:
                - ssh-rsa  LabGradingKey
            yum_repos:
              baseos:
                name: baseos
                gpgcheck: False
                baseurl: http://content.example.com/rhel9.5/x86_64/dvd/BaseOS
              appstream:
                name: appstream
                gpgcheck: False
                baseurl: http://content.example.com/rhel9.5/x86_64/dvd/AppStream
            packages:
              - vim-enhanced
              - curl
              - bash-completion
            runcmd:
            - [ setsebool, -P, virt_qemu_ga_manage_ssh, on ]
            - [ dnf, update, -y, openssh-server ]
        name: cloudinitdisk
