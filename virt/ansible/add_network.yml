---
- name: Add network interface 
  hosts: localhost
  gather_facts: false
  become: false
  force_handlers: true

  tasks:

    - name: Ensure VM is stopped
      redhat.openshift_virtualization.kubevirt_vm:
        name: "{{ my_vm }}"
        namespace: "{{ my_namespace }}"
        running: false
        wait: true

    - name: Get current VM YAML
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ my_vm }}"
        namespace: "{{ my_namespace }}"
      register: vm_info

    - name: Extract interfaces and networks
      set_fact:
        vm_interfaces: "{{ (vm_info.resources[0].spec.template.spec.domain.devices.interfaces | default([])) | list }}"
        vm_networks: "{{ (vm_info.resources[0].spec.template.spec.networks | default([])) | list }}"

    - name: Ensure pod interface is present
      set_fact:
        vm_interfaces: "{{ [ {'name': 'default', 'masquerade': {}} ] + vm_interfaces if (vm_interfaces | selectattr('name','equalto','default') | list | length) == 0 else vm_interfaces }}"

    - name: Ensure pod network is present
      set_fact:
        vm_networks: "{{ [ {'name': 'default', 'pod': {}} ] + vm_networks if (vm_networks | selectattr('name','equalto','default') | list | length) == 0 else vm_networks }}"

    - name: Ensure multus interface is added 
      set_fact:
        vm_interfaces: "{{ vm_interfaces + [ {'name': 'nic1', 'bridge': {}, 'model': 'virtio', 'macAddress': '02:42:ac:11:00:02'} ] if not (vm_interfaces | selectattr('name','equalto','nic1') | list) else vm_interfaces }}"

    - name: Ensure multus network is added 
      set_fact:
        vm_networks: "{{ vm_networks + [ {'name': 'nic1', 'multus': {'networkName': 'default/' + my_nad }} ] if not (vm_networks | selectattr('name','equalto','nic1') | list) else vm_networks }}"

    - name: Ensure VM is patched 
      kubernetes.core.k8s_json_patch:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ my_vm }}"
        namespace: "{{ my_namespace }}"
        patch:
          - op: replace
            path: /spec/template/spec/domain/devices/interfaces
            value: "{{ vm_interfaces }}"
          - op: replace
            path: /spec/template/spec/networks
            value: "{{ vm_networks }}"
        wait: false

    - name: Ensure VM is started
      redhat.openshift_virtualization.kubevirt_vm:
        name: "{{ my_vm }}"
        namespace: "{{ my_namespace }}"
        running: true
        wait: true

