---
- name: Add network interface
  hosts: localhost
  gather_facts: false
  become: false
  force_handlers: true

  tasks:

    - name: Get current VM YAML
      register: vm_info
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ my_vm }}"
        namespace: "{{ my_namespace }}"

    - name: Extract interfaces and networks
      set_fact:
        vm_interfaces: "{{ (vm_info.resources[0].spec.template.spec.domain.devices.interfaces | default([])) | list }}"
        vm_networks:   "{{ (vm_info.resources[0].spec.template.spec.networks | default([])) | list }}"

    - name: Ensure pod interface is present
      set_fact:
        vm_interfaces: >-
          {{ [ { 'name': 'default', 'masquerade': {} } ] + vm_interfaces
             if (vm_interfaces | selectattr('name','equalto','default') | list | length) == 0
             else vm_interfaces }}

    - name: Ensure pod network is present
      set_fact:
        vm_networks: >-
          {{ [ { 'name': 'default', 'pod': {} } ] + vm_networks
             if (vm_networks | selectattr('name','equalto','default') | list | length) == 0
             else vm_networks }}

    - name: Generate a NIC name for this NAD
      set_fact:
        vm_nicname: "nic-{{ my_nad }}-{{ tower_job_id }}-{{ lookup('community.general.random_string',
                                   length=2,
                                   upper=false,
                                   lower=true,
                                   digits=true,
                                   special=false) }}"

    - name: Ensure multus interface is added (for this NAD)
      set_fact:
        vm_interfaces: >-
          {{ vm_interfaces + [
               { 'name': vm_nicname, 'bridge': {}, 'model': 'virtio' }
             ]
             if not (vm_interfaces | selectattr('name','equalto', vm_nicname) | list)
             else vm_interfaces }}

    - name: Ensure multus network is added (bound to this NAD)
      set_fact:
        vm_networks: >-
          {{ vm_networks + [
               { 'name': vm_nicname,
                 'multus': { 'networkName': 'default/' + my_nad }
               }
             ]
             if not (vm_networks | selectattr('name','equalto', vm_nicname) | list)
             else vm_networks }}

    - name: Debug before patching
      debug:
        msg:
          - "NIC name for {{ my_nad }} : {{ vm_nicname }}"
          - "Interfaces: {{ vm_interfaces }}"
          - "Networks: {{ vm_networks }}"

    - name: Patch VM
      kubernetes.core.k8s_json_patch:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ my_vm }}"
        namespace: "{{ my_namespace }}"
        patch:
          - op: replace
            path: /spec/template/spec/domain/devices/interfaces
            value: "{{ vm_interfaces }}"
          - op: replace
            path: /spec/template/spec/networks
            value: "{{ vm_networks }}"
        wait: true

