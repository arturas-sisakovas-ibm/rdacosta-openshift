[defaults]
deprecation_warnings = false
inventory = ./my_inventory/inventory.kubevirt.yml 
#inventory = ./my_inventory
ask_ssh_pass = false
host_key_checking = false
become = false
remote_user = cloud-user 
forks = 200
vault_password_file = ~/.vault-passwd
collections_path = ./collections/

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml, kubevirt.core.kubevirt

[galaxy]
server_list = published,validated,galaxy

[galaxy_server.galaxy]
url=https://galaxy.ansible.com

