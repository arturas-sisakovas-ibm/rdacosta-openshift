---
- name: Install SSH pubkey 
  hosts: "{{ my_namespace }}-{{ my_vm }}"
  gather_facts: true
  force_handlers: true
  become: true

  vars:

    my_sshkey: "ssh-rsa  LabGradingKey"

  tasks:

    - name: Ensure SSH public key is installed
      ansible.builtin.authorized_key:
        user: cloud-user
        state: present
        key: "{{ my_sshkey }}"
        manage_dir: true 

