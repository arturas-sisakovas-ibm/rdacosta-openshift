---
- name: Add labels to VM 
  hosts: localhost
  gather_facts: false
  become: false
  force_handlers: true

  tasks:

    - name: Ensure label(s) exist 
      redhat.openshift.k8s:
        template: templates/add_labels.j2

    - name: Print message
      ansible.builtin.debug:
        msg: |

          🚨     🚨     🚨     🚨     🚨     🚨     🚨     🚨     🚨     🚨     🚨     🚨

                  Do not forget to restart your VM for these labels to take effect

          🚨     🚨     🚨     🚨     🚨     🚨     🚨     🚨     🚨     🚨     🚨     🚨
        
    - name: Restart VM
      when: my_restart == "Yes"
      redhat.openshift_virtualization.kubevirt_vm:
        name: "{{ my_vm }}"
        namespace: "{{ my_namespace }}"
        state: restarted
        wait: true
