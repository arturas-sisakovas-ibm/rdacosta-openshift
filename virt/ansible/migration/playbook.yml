---
- name: Migrate VMs from VMware to OpenShift Virtualization using MTV
  hosts: localhost
  gather_facts: false
  vars:
    source_provider: vmware
    destination_provider: host
    network_maps:
      - source: "{{ vmware_net_1 }}"
        destination: "{{ host_net_1 }}"
      - source: "{{ vmware_net_2 }}"
        destination: "{{ host_net_2 }}"
    storage_maps:
      - source: "{{ vmware_storage }}"
        destination: "{{ host_storage }}"
    vms_to_migrate: "{{ vms }}" 

  tasks:

    - name: Create Network Maps
      k8s:
        state: present
        definition:
          apiVersion: migrations.openshift.io/v1alpha1
          kind: NetworkMap
          metadata:
            name: network-map-{{ item.source | replace(":", "-") }}
            namespace: openshift-mtv
          spec:
            source:
              provider: "{{ source_provider }}"
            destination:
              provider: "{{ destination_provider }}"
            map:
              - source: "{{ item.source }}"
                destination: "{{ item.destination }}"
      loop: "{{ network_maps }}"

    - name: Create Storage Map
      k8s:
        state: present
        definition:
          apiVersion: migrations.openshift.io/v1alpha1
          kind: StorageMap
          metadata:
            name: storage-map
            namespace: openshift-mtv
          spec:
            source:
              provider: "{{ source_provider }}"
            destination:
              provider: "{{ destination_provider }}"
            map:
              - source: "{{ storage_maps[0].source }}"
                destination: "{{ storage_maps[0].destination }}"

    - name: Create Migration Plans
      k8s:
        state: present
        definition:
          apiVersion: migrations.openshift.io/v1alpha1
          kind: Plan
          metadata:
            name: migrate-{{ item }}
            namespace: openshift-mtv
          spec:
            description: Migration plan for VM {{ item }}
            provider:
              source: "{{ source_provider }}"
              destination: "{{ destination_provider }}"
            map:
              network: network-map-{{ network_maps[0].source | replace(":", "-") }}
              storage: storage-map
            vms:
              - name: "{{ item }}"
                namespace: ""  # Fill in if your VM is in a named folder/namespace
            targetNamespace: "{{ item }}-namespace"
            warm: false
      loop: "{{ vms_to_migrate }}"

