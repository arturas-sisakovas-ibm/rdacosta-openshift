---
- name: Migrate VMs from VMware to OpenShift Virtualization using MTV
  hosts: localhost
  gather_facts: false
  vars:
    source_provider: vmware
    destination_provider: host
    network_map_name: vmware-9ht5w
    storage_map_name: vmware-8g72m
    vms_to_migrate: "{{ vms_to_migrate_raw.split(',') | map('trim') | list }}"

  tasks:
    - name: Create Migration Plans
      k8s:
        state: present
        definition:
          apiVersion: forklift.konveyor.io/v1beta1
          kind: Plan
          metadata:
            name: migrate-{{ item }}
            namespace: openshift-mtv
          spec:
            description: Migration plan for VM {{ item }}
            provider:
              source:
                name: "{{ source_provider }}"
                namespace: openshift-mtv
              destination:
                name: "{{ destination_provider }}"
                namespace: openshift-mtv
            map:
              network:
                name: "{{ network_map_name }}"
                namespace: openshift-mtv
              storage:
                name: "{{ storage_map_name }}"
                namespace: openshift-mtv
            vms:
              - name: "{{ item }}"
                namespace: ""
            targetNamespace: "{{ item }}-namespace"
            warm: false
      loop: "{{ vms_to_migrate }}"

