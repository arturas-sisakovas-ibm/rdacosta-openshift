---
- name: Update compute resources 
  hosts: localhost
  gather_facts: false
  become: false
  force_handlers: true

  tasks:

    - name: Update CPU cores and guest memory
      redhat.openshift_virtualization.kubevirt_vm:
        name: "{{ my_vm }}"
        namespace: "{{ my_namespace }}"
        state: present
        annotations:
          kubemacpool.io/inject-mac: "false"
        spec:
          domain:
            devices: {}
            cpu:
              cores: "{{ my_cpu_cores | default(omit) }}"
              sockets: "{{ my_cpu_sockets | default(omit) }}"
              threads: "{{ my_cpu_threads | default(omit) }}"
            memory:
              guest: "{{ my_memory | default(omit) }}Gi"


