---
- name: Update compute resources 
  hosts: localhost
  gather_facts: false
  become: false
  force_handlers: true

  tasks:

    - name: Update CPU cores and guest memory
      redhat.openshift_virtualization.kubevirt_vm:
        name: "{{ my_vm }}"
        namespace: "{{ my_namespace }}"
        state: present
        spec:
          template:
            spec:
              domain:
                cpu:
                  cores: "{{ my_cpu_cores }}"
                resources:
                  requests:
                    memory: {{ my_memory }}Gi
