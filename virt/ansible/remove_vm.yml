---
- name: Remove VM
  hosts: localhost
  gather_facts: false
  become: false
  force_handlers: true

  tasks:

    - name: Ensure VM is removed
      redhat.openshift.k8s:
        name: "{{ my_vm | mandatory('You must specify the VM to remove using the variable my_vm') }}"
        namespace: "{{ my_namespace | default('vms') }}"
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        state: absent
