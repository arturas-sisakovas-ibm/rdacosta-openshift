---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  generateName: generic-vm-
  labels:
    app: generic-vm
    kubevirt.io/dynamic-credentials-support: "true"
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: rootdisk
      spec:
        source:
          http:
            url: http://utility:8080/openshift4/images/rhel9.qcow2
        storage:
          resources:
            requests:
              storage: 10Gi
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: small
        vm.kubevirt.io/os: rhel9
        vm.kubevirt.io/workload: server
      labels:
        kubevirt.io/size: small
        network.kubevirt.io/headlessService: headless
    spec:
      architecture: amd64
      domain:
        cpu:
          cores: 1
          sockets: 1
          threads: 1
        memory:
          guest: 2Gi
        machine:
          type: pc-q35-rhel9.4.0
        firmware:
          bootloader:
            efi: {}
        features:
          acpi: {}
          smm:
            enabled: true
        devices:
          networkInterfaceMultiqueue: true
          rng: {}
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              model: virtio
              masquerade: {}
      hostname: generic-vm
      subdomain: headless
      livenessProbe:
        guestAgentPing:
          timeoutSeconds: 5
        initialDelaySeconds: 40
        periodSeconds: 5
        successThreshold: 1
        failureThreshold: 3
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 180
      volumes:
        - name: rootdisk
          dataVolume:
            name: rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              user: cloud-user
              password: redhatocp
              chpasswd: { expire: False }
              ssh_authorized_keys:
                - ssh-rsa  LabGradingKey
              yum_repos:
                baseos:
                  name: baseos
                  gpgcheck: False
                  baseurl: http://content.example.com/rhel9.5/x86_64/dvd/BaseOS
                appstream:
                  name: appstream
                  gpgcheck: False
                  baseurl: http://content.example.com/rhel9.5/x86_64/dvd/AppStream
              packages:
                - vim-enhanced
                - curl
                - bash-completion
              runcmd:
                - [ setsebool, -P, virt_qemu_ga_manage_ssh, on ]
                - [ dnf, -y, update, openssh-server ]
