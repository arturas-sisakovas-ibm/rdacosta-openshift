spec:
  template:
    spec:
      tolerations:
      - effect: NoSchedule
        key: sla
        operator: Equal
        value: premium

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: tier
                operator: In
                values:
                - production
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: kubevirt.io/domain
                operator: In
                values:
                - web1
            topologyKey: kubernetes.io/hostname
