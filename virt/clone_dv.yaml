apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: my-clone
spec:
  storage:
    resources:
      requests:
        storage: 1Gi
    storageClassName: ocs-external-storagecluster-ceph-rbd-virtualization
  source:
    pvc:
      name: my-source
      namespace: my-source-project

