apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: restricted-network
spec:
  nodeSelector:
    kubernetes.io/hostname: worker01  
  config: '{
    "cniVersion": "0.3.1",
    "name": "datacenter-network",
    "type": "macvlan",
    "master": "ens4",
    "mode": "bridge",
    "ipam": {
      "type": "host-local",
      "subnet": "192.168.51.0/24",
      "rangeStart": "192.168.51.245",
      "rangeEnd": "192.168.51.250",
      "routes": [{"dst": "0.0.0.0/0"}]
    }
  }'

