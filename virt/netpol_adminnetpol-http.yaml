apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: allow-http-from-openshift-ingress
spec:
  priority: 10
  subject:
    namespaces: {}
  ingress:
  - name: "allow-http-from-openshift-ingress"
    action: "Allow"
    from:
    - namespaces:
        matchLabels:
          network.openshift.io/policy-group: ingress 
