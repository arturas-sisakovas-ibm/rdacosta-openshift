---
apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: allow-https-everywhere
spec:
  priority: 5
  subject:
    namespaces: {}
  ingress:
  - name: allow-https
    action: Allow
    ports:
    - portNumber:
        port: 443
        protocol: TCP
---
apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: deny-http-everywhere
spec:
  priority: 10
  subject:
    namespaces: {}
  ingress:
  - name: deny-http
    action: Deny
    ports:
    - portNumber:
        port: 80
        protocol: TCP
