---
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: httpd-template
  namespace: openshift
  annotations:
    description: "Creates a Deployment, Service, and Route for quay.io/rdacosta/my_httpd:latest"
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}
      labels:
        app: ${NAME}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${NAME}
      template:
        metadata:
          labels:
            app: ${NAME}
        spec:
          containers:
            - name: httpd
              image: quay.io/rdacosta/my_httpd:latest
              imagePullPolicy: IfNotPresent
              ports:
                - name: http
                  containerPort: 8080
                  protocol: TCP
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEM_REQUEST}
                limits:
                  cpu: ${CPU_LIMIT}
                  memory: ${MEM_LIMIT}

  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}
      labels:
        app: ${NAME}
    spec:
      selector:
        app: ${NAME}
      ports:
        - name: http
          port: 80
          targetPort: http
          protocol: TCP

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${NAME}
      labels:
        app: ${NAME}
    spec:
      to:
        kind: Service
        name: ${NAME}
        weight: 100
      port:
        targetPort: http
      tls:
        termination: edge
      host: ${FQDN}

parameters:
  - name: NAME
    description: "Resource base name (generated by default as httpd + 5 alnum)."
    required: true
    generate: expression
    from: "httpd-[a-z0-9]{5}"

  - name: FQDN
    description: "Optional fully qualified domain name for the Route host (leave empty for automatic host)."
    required: false

  - name: CPU_REQUEST
    description: "CPU request"
    required: true
    value: "10m"

  - name: CPU_LIMIT
    description: "CPU limit"
    required: true
    value: "50m"

  - name: MEM_REQUEST
    description: "Memory request"
    required: true
    value: "32Mi"

  - name: MEM_LIMIT
    description: "Memory limit"
    required: true
    value: "128Mi"
